[workspace]
resolver = "2"
members = [
    "crates/shared_contract",
    "backend",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nguyen Xuan Dong <dongnx01@modelradar.local>"]
license = "MIT"

[workspace.dependencies]
shared_contract = { path = "crates/shared_contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "socks"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
arc-swap = "1.7"
dashmap = "6.1"
regex = "1.11"
validator = { version = "0.19", features = ["derive"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
unicode-normalization = "0.1"
